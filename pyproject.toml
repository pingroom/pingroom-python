[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pingroom"
dynamic = ["version"]
description = "Official Python SDK for the PingRoom agent API: send Pings, ask humans, wait for answers, live status, and webhook verification."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "PingRoom" }]
keywords = ["pingroom", "notifications", "push", "agent", "webhook", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff~=0.17.4", "mypy>=1.10,<3"]

[project.urls]
Homepage = "https://pingroom.io"
Repository = "https://github.com/pingroom/pingroom-python"
Issues = "https://github.com/pingroom/pingroom-python/issues"
Changelog = "https://github.com/pingroom/pingroom-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/pingroom/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pingroom"]

[tool.hatch.build.targets.sdist]
include = ["src/pingroom", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "RUF"]
ignore = [
  "E501",   # long lines in docstrings and error messages are deliberate
  "RUF001", # ambiguous characters appear in the test vectors on purpose
  "RUF002",
  "RUF003",
  "B008",
]

[tool.mypy]
strict = true
files = ["src/pingroom", "tests"]
warn_unreachable = true
